name: Ruff

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3

    - name: Install ruff
      run: uv tool install ruff

    - name: Run ruff
      run: uvx ruff check --output-format=github djangocms_versioning tests
