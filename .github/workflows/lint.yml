name: Ruff

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

    - name: Install ruff
      run: uv tool install ruff

    - name: Run ruff
      run: uvx ruff check --output-format=github djangocms_versioning tests
