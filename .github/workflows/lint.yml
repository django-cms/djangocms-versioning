name: Ruff

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

    - name: Install ruff
      run: uv tool install ruff

    - name: Run ruff
      run: uvx ruff check --output-format=github djangocms_versioning tests
